name: Feature request
description: Suggest a safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem or goal
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    attributes:
      label: Hardware and safety impact
      description: Explain whether this changes fan endpoints, minimum speed, or restore behavior.
    validations:
      required: true
